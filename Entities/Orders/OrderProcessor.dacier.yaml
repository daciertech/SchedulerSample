apiVersion: 1.0
kind: workflow
metadata:
  name: OrderProcessor
  description: Process orders
  tags: [orders, sample]
spec:
  actions:
    - action: cronSchedule
      cronExpression: "@hourly"
  steps:
    - step: PSScript
      name: GetFiles
      arguments:
      -
        name: Region
        value: $Region
      -
        name: Division
        value: $Division
      resultsVariable: filesToProcess
      script: |
          param(
            [string]$Region,
            [string]$Division
          )
          Get-ChildItem -Path "C:\Data\$Region\$Division" -Filter *.txt

    - step: ForEach
      name: ProcessEachFile
      after: [GetFiles]
      inputValues: filesToProcess
      steps:
        - step: PSScript
          name: ProcessFile
          arguments:
          -
            name: CurrentItem
            value: $InputItem
          script: |
              param(
                [System.IO.FileInfo]$CurrentItem
              )
              # Simulate processing the file
              Write-Output "Processing file: $($CurrentItem.FullName)"
              Start-Sleep -Seconds 3

  variables:
  -
    variableName: Region
    value: South
    minimumLength: 1
    maximumLength: 50
    prompt: Please enter the region
    inputType: text
  -
    variableName: Division
    value: Western
    minimumLength: 1
    maximumLength: 10
    prompt: Please enter the division
    inputType: text
