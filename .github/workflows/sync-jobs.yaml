name: sync-jobs

on:
  push:
    branches: [ main ]
    paths:
      - 'Entities/**'
      - '.github/workflows/sync-jobs.yaml'

  pull_request:
    branches: [ main ]
    paths:
      - 'Entities/**'
      - '.github/workflows/sync-jobs.yaml'

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:


jobs:
  build:

    runs-on: ubuntu-latest

    # permissions:
    #   id-token: write
    #   contents: read

    defaults:
      run:
        shell: bash

    steps:
    - name: Login to Azure
      uses: azure/login@v2
      with:
        client-id: 68ffd246-220c-4383-996a-bb1e01ccfdcc
        tenant-id: cb52a8e1-1116-4162-8254-e8398c5381e1
        subscription-id: f9d56a33-beed-4298-8d04-b0d9392cd2b3

    - name: Sync Jobs
      uses: daciertech/scheduler-sync@main
      with:
        organization: Dev
        token: ${{ secrets.GITHUB_TOKEN }}
        tenant: Dacier
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        ACTIONS_ID_TOKEN_REQUEST_URL: ${{ env.ACTIONS_ID_TOKEN_REQUEST_URL }}
        ACTIONS_ID_TOKEN_REQUEST_TOKEN: ${{ env.ACTIONS_ID_TOKEN_REQUEST_TOKEN }}
        CLIENT_ID: 68ffd246-220c-4383-996a-bb1e01ccfdcc
        TENANT_ID: cb52a8e1-1116-4162-8254-e8398c5381e1

